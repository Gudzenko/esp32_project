<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESP32</title>
<link rel="icon" href="data:,">
<style>
  body { font-family: sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; }
  #status { font-weight: bold; }
  .hint { color: #666; font-size: 0.85rem; }
  fieldset { margin-bottom: 1rem; }
  .prop { margin: 0.3rem 0; }
  .prop button.active { font-weight: bold; }
  #log { background: #f4f4f4; padding: 0.5rem; height: 20rem; overflow-y: auto; font-size: 0.85rem; }
</style>
</head>
<body>
<h1>ESP32</h1>
<p>Connection: <span id="status"></span></p>
<p>
  <button class="request" data-cmd="describe" disabled>describe</button>
  <button class="request" data-cmd="get" disabled>get</button>
</p>
<div id="devices"></div>
<p class="hint">Browser console (F12): <code>send({cmd: "foo"})</code>, <code>sendRaw("not json")</code></p>
<pre id="log"></pre>
<script>
const kWsPort = 81;
const kReconnectDelayMs = 5000;
const kPingIntervalMs = 2500;
const kSilenceTimeoutMs = 5000;

const Status = {
  connecting: "connecting",
  connected: "connected",
  busy: "board busy",
  lost: "no connection",
};

const statusView = document.getElementById("status");
const requestButtons = document.querySelectorAll("button.request");
const devicesView = document.getElementById("devices");
const logView = document.getElementById("log");

let socket = null;
let checkTimer = null;
let lastMessageAt = 0;
let boardBusy = false;
let nextId = 1;
let lastBoardTime = null;
const pending = new Map();

function timeNow() {
  const now = new Date();
  return now.toLocaleTimeString("en-GB") + "." + String(now.getMilliseconds()).padStart(3, "0");
}

function log(direction, text) {
  logView.textContent += `${timeNow()} ${direction} ${text}\n`;
  logView.scrollTop = logView.scrollHeight;
}

function setStatus(status) {
  statusView.textContent = status;
  for (const button of document.querySelectorAll("button")) {
    button.disabled = status !== Status.connected;
  }
}

function parseJson(text) {
  try {
    return JSON.parse(text);
  } catch {
    return null;
  }
}

function isConnected() {
  return socket !== null && socket.readyState === WebSocket.OPEN;
}

function send(request, quiet = false) {
  if (!isConnected()) {
    log("--", "not connected");
    return;
  }
  const message = { id: nextId++, ...request };
  const text = JSON.stringify(message);
  pending.set(message.id, { quiet, cmd: request.cmd, sentAt: Date.now() });
  socket.send(text);
  if (!quiet) {
    log("->", text);
  }
}

function sendRaw(text) {
  if (!isConnected()) {
    log("--", "not connected");
    return;
  }
  socket.send(text);
  log("->", text);
}

function requestState() {
  send({ cmd: "describe" });
  send({ cmd: "get" });
}

function connect() {
  setStatus(Status.connecting);
  socket = new WebSocket(`ws://${location.hostname}:${kWsPort}/`);
  socket.onopen = onOpen;
  socket.onmessage = onMessage;
  socket.onclose = onClose;
  lastMessageAt = Date.now();
  checkTimer = setInterval(checkConnection, kPingIntervalMs);
}

function onOpen() {
  boardBusy = false;
  lastMessageAt = Date.now();
  setStatus(Status.connected);
  log("--", "connected");
  requestState();
}

function onMessage(event) {
  lastMessageAt = Date.now();
  const message = parseJson(event.data);
  if (message === null) {
    log("<-", event.data);
    return;
  }
  checkBoardRestart(message.time);
  boardBusy = message.error?.code === "busy";
  const request = pending.get(message.id);
  pending.delete(message.id);
  if (message.status === "ok") {
    applyResponse(request?.cmd, message);
  }
  if (request?.quiet && message.status === "ok") {
    return;
  }
  const roundTrip = request ? ` (${Date.now() - request.sentAt} ms)` : "";
  log("<-", event.data + roundTrip);
}

function applyResponse(cmd, message) {
  if (cmd === "describe") {
    renderDevices(message.data.devices);
  } else if ((cmd === "get" || cmd === "set") && message.device) {
    showValues(message.device, message.data);
  } else if (cmd === "get") {
    for (const [device, values] of Object.entries(message.data)) {
      showValues(device, values);
    }
  }
}

function renderDevices(devices) {
  devicesView.replaceChildren();
  for (const [device, description] of Object.entries(devices)) {
    const box = document.createElement("fieldset");
    const legend = document.createElement("legend");
    legend.textContent = `${device} (${description.type})`;
    box.append(legend);
    for (const [prop, info] of Object.entries(description.props)) {
      box.append(renderProp(device, prop, info));
    }
    devicesView.append(box);
  }
}

function renderProp(device, prop, info) {
  const row = document.createElement("div");
  row.className = "prop";
  row.dataset.device = device;
  row.dataset.prop = prop;
  const value = document.createElement("span");
  value.className = "value";
  row.append(`${prop}: `, value, " ");
  for (const option of info.values ?? []) {
    const button = document.createElement("button");
    button.textContent = option;
    button.dataset.value = option;
    button.onclick = () => send({ cmd: "set", device, data: { [prop]: option } });
    row.append(button, " ");
  }
  return row;
}

function showValues(device, values) {
  for (const [prop, value] of Object.entries(values)) {
    const row = devicesView.querySelector(`[data-device="${device}"][data-prop="${prop}"]`);
    if (!row) {
      continue;
    }
    row.querySelector(".value").textContent = value;
    for (const button of row.querySelectorAll("button")) {
      button.classList.toggle("active", button.dataset.value === String(value));
    }
  }
}

function checkBoardRestart(time) {
  if (typeof time !== "number") {
    return;
  }
  if (lastBoardTime !== null && time < lastBoardTime) {
    log("--", "board restarted");
  }
  lastBoardTime = time;
}

function onClose() {
  clearInterval(checkTimer);
  pending.clear();
  setStatus(boardBusy ? Status.busy : Status.lost);
  log("--", `closed, reconnect in ${kReconnectDelayMs / 1000} s`);
  setTimeout(connect, kReconnectDelayMs);
}

function checkConnection() {
  if (Date.now() - lastMessageAt > kSilenceTimeoutMs) {
    dropConnection("no answer from the board");
    return;
  }
  if (isConnected()) {
    send({ cmd: "ping" }, true);
  }
}

function dropConnection(reason) {
  log("--", reason);
  socket.onclose = null;
  socket.close();
  onClose();
}

for (const button of requestButtons) {
  button.onclick = () => send({ cmd: button.dataset.cmd });
}
connect();
</script>
</body>
</html>
