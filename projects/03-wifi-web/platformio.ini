[platformio]
extra_configs = ../../platformio-common.ini
default_envs = esp32

[env:esp32]
extends = common_esp32
board_build.embed_txtfiles = src/index.html
lib_deps =
    symlink://../../lib/Button
    links2004/WebSockets@2.7.3
    bblanchon/ArduinoJson@7.4.3

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = -<*> +<Protocol.cpp> +<Devices.cpp>
build_flags = -std=gnu++17 -Wall -Wextra
lib_deps =
    bblanchon/ArduinoJson@7.4.3
