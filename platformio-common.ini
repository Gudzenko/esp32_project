[common_esp32]
; Pinned on purpose: pioarduino 55.03.313 = Arduino-ESP32 3.3.13 + ESP-IDF 5.5
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.313/platform-espressif32.zip
board = esp32dev
; 2 x 1.9 MB app slots (OTA), 128 KB file system. See docs/memory.md
board_build.partitions = min_spiffs.csv
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600
build_flags = -Wall -Wextra
